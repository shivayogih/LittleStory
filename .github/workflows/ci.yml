name: CI

on:
  pull_request:
  push:
    branches: [main, staging, development]

# Read-only token; no secrets are used by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # JDK 21 for Gradle; the build also asks for it as its toolchain. `cache: gradle` caches
      # the Gradle wrapper and dependencies, keyed on the build files.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      # check = unit + Robolectric tests, Android lint, Detekt, ktlint, checkNoHardcoding, checkTranslations,
      # and the Kover coverage gate (LS-120).
      - name: Verify
        run: ./gradlew check assembleDebug --stacktrace

      # Compose Preview Screenshot Testing (experimental): renders the @PreviewTest images in EN, KN
      # and KN at 200 % for review. Not a gate until the owner approves reference images.
      - name: Render preview screenshots
        if: always()
        run: ./gradlew :app:updateDebugScreenshotTestDefaultTestSuite --stacktrace

      # Debug-signed APK for testing on a phone; never a release build and never published to a store.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LittleStory-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/outputs/roborazzi/**
            app/src/screenshotTestDefaultDebug/reference/**
            **/build/test-results/**
